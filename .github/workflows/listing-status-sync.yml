name: Discover and sync property listing statuses
on:
  workflow_dispatch:
  schedule:
    - cron: '41 19 * * *'
permissions:
  contents: write
concurrency:
  group: listing-status-sync
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/sync_listing_status.py
      - name: Commit validated status changes and stage new listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/properties.json assets/property-photos/
          if ! git diff --cached --quiet; then
            git commit -m "Synchronise confirmed listing statuses and stage discoveries"
            git pull --rebase
            git push
          fi
