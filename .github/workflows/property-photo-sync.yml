name: Sync property photographs
on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'
permissions:
  contents: write
concurrency:
  group: property-photo-sync
  cancel-in-progress: false
jobs:
  sync-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/sync_property_photos.py
      - name: Commit updated photographs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/properties.json assets/property-photos/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified property listing photographs"
            git push
          fi
