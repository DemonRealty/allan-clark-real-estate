name: Listing sync proof of concept
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-public-listings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/inspect_independent_agent.py
      - uses: actions/upload-artifact@v4
        with:
          name: listing-sync-preview
          path: listing-sync-preview.json
